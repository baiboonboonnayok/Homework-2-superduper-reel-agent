<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    width: 1080px;
    height: 1920px;
    background: linear-gradient(180deg, #101820 0%, #1a2531 100%);
    color: #ffffff;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 100px;
    box-sizing: border-box;
  }
  .tag {
    letter-spacing: 4px;
    font-size: 24px;
    color: #f4c95d;
    font-weight: 600;
    margin-bottom: 60px;
    text-transform: uppercase;
  }
  h1 {
    font-size: 88px;
    line-height: 1.15;
    font-weight: 800;
    color: #ffffff;
    margin: 0;
  }
  .accent-line {
    width: 120px;
    height: 6px;
    background: #f4c95d;
    margin-top: 60px;
    border-radius: 3px;
  }
</style>
</head>
<body>
  <div class="tag">SUPERDUPER · MEN'S APPAREL OEM</div>
  <h1>One Partner. Every Men’s Essential.</h1>
  <div class="accent-line"></div>
</body>
</html>
