<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    width: 1080px;
    height: 1920px;
    background: radial-gradient(circle at 80% 10%, #4a1942 0%, transparent 45%),
                linear-gradient(160deg, #1b0f24 0%, #3b1029 100%);
    color: #f5ece0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 80px;
    box-sizing: border-box;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(90deg, #e8b04b, #f4d58d);
    color: #2a1608;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 1px;
    padding: 12px 30px;
    border-radius: 999px;
    margin-bottom: 50px;
  }
  h1 {
    font-size: 54px;
    color: #ffffff;
    margin-bottom: 70px;
    text-align: center;
    font-weight: 800;
  }
  .steps {
    display: flex;
    flex-direction: column;
    gap: 50px;
    width: 100%;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .step-number {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: linear-gradient(135deg, #e8b04b, #f4d58d);
    color: #2a1608;
    font-size: 36px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .step-box {
    background: rgba(245, 236, 224, 0.08);
    border: 2px solid #e8b04b;
    border-radius: 16px;
    padding: 28px 36px;
    font-size: 32px;
    font-weight: 600;
    flex-grow: 1;
  }
  .arrow {
    font-size: 46px;
    color: #e8b04b;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="badge">🎯 AI PIPELINE</div>
  <h1>Measure What Ratings Miss</h1>
  <div class="steps">
    <div class="step">
      <div class="step-number">1</div>
      <div class="step-box">Highlight AI Restaurant Score</div>
    </div>
    <div class="arrow">&#8595;</div>
    <div class="step">
      <div class="step-number">2</div>
      <div class="step-box">Compare against category benchmark</div>
    </div>
    <div class="arrow">&#8595;</div>
    <div class="step">
      <div class="step-number">3</div>
      <div class="step-box">Map operations versus hospitality</div>
    </div>
  </div>
</body>
</html>
