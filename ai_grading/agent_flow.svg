<svg width="900" height="950" viewBox="0 0 900 950" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#6b7785" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="450" y="34" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#1a2531">SuperDuper reel agent — pipeline overview</text>

  <rect x="250" y="60" width="400" height="64" rx="10" fill="#1a2531" stroke="#f4c95d" stroke-width="1.5"/>
  <text x="450" y="85" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff">project_proposal.md</text>
  <text x="450" y="107" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#aab4bf">SuperDuper OEM pitch (input)</text>

  <line x1="450" y1="124" x2="450" y2="164" stroke="#6b7785" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="230" y="168" width="440" height="76" rx="10" fill="#1a2531" stroke="#f4c95d" stroke-width="1.5"/>
  <text x="450" y="196" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff">Planner agent (gpt-5.6-luna)</text>
  <text x="450" y="219" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#aab4bf">Generates 5-slide plan → slide_plan.json</text>

  <line x1="450" y1="244" x2="450" y2="284" stroke="#6b7785" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="90" y="288" width="720" height="270" rx="14" fill="none" stroke="#f4c95d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="450" y="312" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#b8860b">Runs in parallel for all 5 slides (ThreadPoolExecutor)</text>

  <rect x="150" y="334" width="220" height="60" rx="8" fill="#1a2531" stroke="#f4c95d" stroke-width="1.2"/>
  <text x="260" y="357" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Critique agent</text>
  <text x="260" y="378" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#aab4bf">Flags weak headlines</text>

  <rect x="460" y="334" width="220" height="60" rx="8" fill="#1a2531" stroke="#f4c95d" stroke-width="1.2"/>
  <text x="570" y="357" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Revision agent</text>
  <text x="570" y="378" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#aab4bf">Rewrites headline &amp; narration</text>

  <line x1="370" y1="364" x2="456" y2="364" stroke="#6b7785" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="180" y="444" width="220" height="70" rx="8" fill="#1a2531" stroke="#f4c95d" stroke-width="1.2"/>
  <text x="290" y="469" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">TTS narration</text>
  <text x="290" y="491" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#aab4bf">tts-1-hd → audio/slide_N.mp3</text>

  <rect x="500" y="444" width="220" height="70" rx="8" fill="#1a2531" stroke="#f4c95d" stroke-width="1.2"/>
  <text x="610" y="469" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">HTML + visual render</text>
  <text x="610" y="491" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#aab4bf">→ slides/slide_N.html</text>

  <line x1="540" y1="394" x2="300" y2="440" stroke="#6b7785" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="600" y1="394" x2="605" y2="440" stroke="#6b7785" stroke-width="1.8" marker-end="url(#arrow)"/>

  <line x1="450" y1="558" x2="450" y2="598" stroke="#6b7785" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="230" y="602" width="440" height="70" rx="10" fill="#1a2531" stroke="#f4c95d" stroke-width="1.5"/>
  <text x="450" y="628" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff">Playwright (headless Chromium)</text>
  <text x="450" y="651" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#aab4bf">Screenshots each slide → slide_N.png</text>

  <line x1="450" y1="672" x2="450" y2="712" stroke="#6b7785" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="230" y="716" width="440" height="70" rx="10" fill="#1a2531" stroke="#f4c95d" stroke-width="1.5"/>
  <text x="450" y="742" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff">ffmpeg — per slide</text>
  <text x="450" y="765" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#aab4bf">image + audio → video_clips/clip_N.mp4</text>

  <line x1="450" y1="786" x2="450" y2="826" stroke="#6b7785" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="230" y="830" width="440" height="80" rx="10" fill="#f4c95d" stroke="#1a2531" stroke-width="1.5"/>
  <text x="450" y="860" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#1a2531">ffmpeg concat</text>
  <text x="450" y="884" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#3a3020">clip_1…clip_5 → reel.mp4 (final output)</text>
</svg>
